<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Moedas Bros - Controle Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nuvem n1" aria-hidden="true"></div>
  <div class="nuvem n2" aria-hidden="true"></div>
  <div class="nuvem n3" aria-hidden="true"></div>

  <header class="topo">
    <h1>🍄 SUPER MOEDAS BROS</h1>
    <p>Descubra para onde vão as suas moedas!</p>
  </header>

  <main class="container">

    <!-- RESUMO FINANCEIRO -->
    <section class="resumo" aria-label="Resumo financeiro">
      <div class="bloco bloco-entrada">
        <span class="bloco-icone">🪙</span>
        <span class="bloco-titulo">ENTRADAS</span>
        <strong id="totalEntradas">R$ 0,00</strong>
      </div>
      <div class="bloco bloco-saida">
        <span class="bloco-icone">🔥</span>
        <span class="bloco-titulo">SAÍDAS</span>
        <strong id="totalSaidas">R$ 0,00</strong>
      </div>
      <div class="bloco bloco-saldo" id="blocoSaldo">
        <span class="bloco-icone">🏰</span>
        <span class="bloco-titulo">SALDO</span>
        <strong id="saldoAtual">R$ 0,00</strong>
      </div>
    </section>

    <div class="grade">
      <!-- FORMULÁRIO -->
      <section class="painel" aria-labelledby="tituloForm">
        <h2 id="tituloForm">➕ NOVA FASE</h2>
        <form id="formulario" novalidate>
          <input type="hidden" id="idEdicao">

          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" maxlength="60" placeholder="Ex: Almoço no restaurante" required>

          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="entrada">🪙 Entrada</option>
            <option value="saida">🔥 Saída</option>
          </select>

          <label for="categoria">Categoria</label>
          <select id="categoria"></select>

          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" min="0.01" step="0.01" placeholder="25,00" required>

          <label for="data">Data</label>
          <input type="date" id="data" required>

          <p id="erro" class="erro" role="alert"></p>

          <div class="botoes">
            <button type="submit" id="btnSalvar" class="btn btn-verde">▶ SALVAR</button>
            <button type="button" id="btnCancelar" class="btn btn-cinza" hidden>✖ CANCELAR</button>
          </div>
        </form>
      </section>

      <!-- LISTA -->
      <section class="painel" aria-labelledby="tituloLista">
        <h2 id="tituloLista">📜 MOVIMENTAÇÕES</h2>

        <div class="filtros">
          <input type="search" id="busca" placeholder="🔍 Buscar pela descrição..." aria-label="Buscar pela descrição">
          <select id="filtroCategoria" aria-label="Filtrar por categoria"></select>
        </div>

        <ul id="lista" class="lista"></ul>
        <p id="vazio" class="vazio" hidden>Nenhuma moeda por aqui... 🧱</p>
      </section>
    </div>
  </main>

  <footer class="chao">
    <p>Dados fictícios • Projeto escolar • Feito com HTML, CSS e JS</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
